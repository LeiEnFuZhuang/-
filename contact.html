<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 - 莱恩制造</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8f9fa;color:#333;line-height:1.6}
.container{max-width:800px;margin:0 auto;padding:40px 20px}
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:32px;color:#1a1a1a;margin-bottom:8px}
.header p{color:#666}
.card{background:#fff;padding:36px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{margin-bottom:18px}
.form-group.full-width{grid-column:1/-1}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.form-group label .required{color:#ef4444;margin-left:2px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit}
.form-group textarea{min-height:120px;resize:vertical}
.btn-submit{width:100%;background:#1a1a1a;color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:15px;border:none;cursor:pointer}
.btn-submit:hover{background:#333}
.back-link{display:inline-block;margin-bottom:24px;color:#2563eb;text-decoration:none}
.back-link:hover{text-decoration:underline}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.info-item{background:#fff;padding:24px;border-radius:12px;text-align:center;border:1px solid #e5e7eb}
.info-icon{font-size:28px;margin-bottom:10px}
.info-item h4{font-size:13px;color:#888;margin-bottom:4px}
.info-item p{font-size:14px;color:#1a1a1a;font-weight:600}
.info-item a{color:#1a1a1a;text-decoration:none}
.footer{text-align:center;padding:30px;color:#888;font-size:12px}
@media(max-width:640px){.form-row,.info-grid{grid-template-columns:1fr}.card{padding:24px}}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← 返回首页</a>
  <div class="header">
    <h1>联系我们</h1>
    <p>填写下方表单，我们将在 24 小时内回复您</p>
  </div>
  <div class="info-grid">
    <div class="info-item">
      <div class="info-icon">📧</div>
      <h4>电子邮箱</h4>
      <p>LeiEnFuZhuang@outlook.com</p>
    </div>
    <div class="info-item">
      <div class="info-icon">📱</div>
      <h4>WhatsApp</h4>
      <p>+86 17551350093</p>
    </div>
    <div class="info-item">
      <div class="info-icon">📍</div>
      <h4>地址</h4>
      <p>Guangzhou, China</p>
    </div>
  </div>
  <div class="card">
    <form action="https://formsubmit.co/LeiEnFuZhuang@outlook.com" method="POST">
      <input type="hidden" name="_subject" value="【LEIEN官网询盘】新客户提交">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_autoresponse" value="感谢您联系 LEIEN 蕾恩服饰，我们已收到您的询盘，将在24小时内与您联系。">
      <div class="form-row">
        <div class="form-group">
          <label>您的姓名 <span class="required">*</span></label>
          <input type="text" name="name" placeholder="您的姓名" required>
        </div>
        <div class="form-group">
          <label>公司名称</label>
          <input type="text" name="company" placeholder="选填">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>电子邮箱 <span class="required">*</span></label>
          <input type="email" name="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>电话 / WhatsApp <span class="required">*</span></label>
          <input type="tel" name="phone" placeholder="+86 17551350093" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>咨询类型</label>
          <select name="type">
            <option value="">请选择</option>
            <option value="产品报价">产品报价</option>
            <option value="样衣申请">样衣申请</option>
            <option value="OEM合作">OEM 合作</option>
            <option value="ODM开发">ODM 开发</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label>预计订单量</label>
          <select name="quantity">
            <option value="">请选择</option>
            <option value="100-500件">100 - 500 件</option>
            <option value="500-1000件">500 - 1,000 件</option>
            <option value="1000-5000件">1,000 - 5,000 件</option>
            <option value="5000件以上">5,000 件以上</option>
          </select>
        </div>
      </div>
      <div class="form-group full-width">
        <label>询盘内容 <span class="required">*</span></label>
        <textarea name="message" placeholder="请描述您的需求：款式、面料、颜色、交期等..." required></textarea>
      </div>
      <button type="submit" class="btn-submit">提交询盘</button>
      <p style="font-size:12px;color:#888;margin-top:12px;text-align:center">💡 提示：您也可以直接通过 WhatsApp 联系我们，响应更快</p>
    </form>
  </div>
  <div class="footer">
    <p>© 2026 莱恩制造 | <a href="index.html">返回首页</a></p>
  </div>
</div>
</body>
</html>

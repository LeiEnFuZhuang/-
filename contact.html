<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 - 莱恩制造 Laien Manufacturing</title>
<style>
:root{--primary:#1a3c2f;--accent:#c9a96e;--light:#f8f6f3;--dark:#0f1f18;--text:#2d2d2d;--muted:#777;--border:#e8e4df;--success:#22c55e;--error:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);line-height:1.6;background:var(--light);min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:40px 20px}
.header{text-align:center;margin-bottom:40px;padding-top:20px}
.header .logo{display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:var(--primary);letter-spacing:1px;text-decoration:none;margin-bottom:16px}
.logo-icon{width:40px;height:40px;background:var(--primary);color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.header h1{font-size:32px;font-weight:800;color:var(--primary);margin-bottom:8px}
.header p{color:var(--muted);font-size:15px}

.card{background:#fff;border-radius:16px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.06);padding:36px;margin-bottom:24px}

.alert{padding:14px 18px;border-radius:10px;margin-bottom:20px;display:none;align-items:center;gap:10px;font-size:.95rem}
.alert.show{display:flex}
.alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.alert-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{margin-bottom:18px}
.form-group.full-width{grid-column:1/-1}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--dark);margin-bottom:6px}
.form-group label .required{color:var(--error);margin-left:2px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;transition:.3s;background:#fafafa}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.form-group textarea{min-height:120px;resize:vertical}

.btn-submit{width:100%;background:var(--primary);color:#fff;padding:14px;border-radius:8px;font-weight:700;font-size:15px;border:none;cursor:pointer;transition:.3s}
.btn-submit:hover{background:var(--dark);transform:translateY(-1px)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}

.btn-back{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--primary);padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--border);text-decoration:none;margin-bottom:20px;transition:.3s}
.btn-back:hover{border-color:var(--accent);background:var(--light)}

.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.info-item{background:#fff;padding:24px 16px;border-radius:12px;text-align:center;border:1px solid var(--border);transition:.3s}
.info-item:hover{border-color:var(--accent);transform:translateY(-2px)}
.info-icon{font-size:28px;margin-bottom:10px}
.info-item h4{font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.info-item p{font-size:14px;color:var(--primary);font-weight:600}
.info-item a{color:var(--primary);text-decoration:none}
.info-item a:hover{text-decoration:underline}

.footer{text-align:center;padding:30px 20px;color:var(--muted);font-size:12px}
.footer a{color:var(--primary);text-decoration:none}

@media(max-width:640px){
.form-row{grid-template-columns:1fr}
.info-grid{grid-template-columns:1fr}
.card{padding:24px}
.header h1{font-size:24px}
}
</style>
</head>
<body>

<div class="container">
  <a href="index.html" class="btn-back">← 返回首页</a>

  <div class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">莱</div>
      <span>莱恩制造</span>
    </a>
    <h1>联系我们</h1>
    <p>填写下方表单，我们将在 24 小时内回复您</p>
  </div>

  <div class="info-grid">
    <div class="info-item">
      <div class="info-icon">📧</div>
      <h4>电子邮箱</h4>
      <p><a href="mailto:LeiEnFuZhuang@outlook.com">LeiEnFuZhuang@outlook.com</a></p>
    </div>
    <div class="info-item">
      <div class="info-icon">📱</div>
      <h4>WhatsApp</h4>
      <p><a href="https://wa.me/8617551350093" target="_blank">+86 17551350093</a></p>
    </div>
    <div class="info-item">
      <div class="info-icon">📍</div>
      <h4>地址</h4>
      <p>Guangzhou, China</p>
    </div>
  </div>

  <div class="card">
    <div class="alert alert-success" id="successAlert">
      <span>✅</span>
      <span>提交成功！我们会尽快与您联系。</span>
    </div>
    <div class="alert alert-error" id="errorAlert">
      <span>❌</span>
      <span id="errorText">提交失败，请稍后重试。</span>
    </div>

    <form action="https://formsubmit.co/LeiEnFuZhuang@outlook.com" method="POST" id="contactForm">
      <input type="hidden" name="_next" value="https://leienfuzhuang.github.io/contact.html?sent=1">
      <input type="hidden" name="_subject" value="【LEIEN官网询盘】新客户提交">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_autoresponse" value="感谢您联系 LEIEN 蕾恩服饰，我们已收到您的询盘，将在24小时内与您联系。">
      <input type="hidden" name="_replyto" id="replytoField">

      <div class="form-row">
        <div class="form-group">
          <label>您的姓名 <span class="required">*</span></label>
          <input type="text" name="name" placeholder="您的姓名" required>
        </div>
        <div class="form-group">
          <label>公司名称</label>
          <input type="text" name="company" placeholder="选填">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>电子邮箱 <span class="required">*</span></label>
          <input type="email" name="email" id="emailField" placeholder="example@company.com" required>
        </div>
        <div class="form-group">
          <label>WhatsApp / 电话 <span class="required">*</span></label>
          <input type="tel" name="phone" placeholder="+86 17551350093" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>咨询类型</label>
          <select name="type">
            <option value="">请选择</option>
            <option value="产品报价">产品报价</option>
            <option value="样衣申请">样衣申请</option>
            <option value="OEM合作">OEM 合作</option>
            <option value="ODM开发">ODM 开发</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label>预计订单量</label>
          <select name="quantity">
            <option value="">请选择</option>
            <option value="100-500件">100 - 500 件</option>
            <option value="500-1000件">500 - 1,000 件</option>
            <option value="1000-5000件">1,000 - 5,000 件</option>
            <option value="5000件以上">5,000 件以上</option>
          </select>
        </div>
      </div>

      <div class="form-group full-width">
        <label>感兴趣的产品 / 需求描述 <span class="required">*</span></label>
        <textarea name="message" placeholder="请描述您的需求，例如：感兴趣的款号、目标数量及颜色、目标市场及尺码要求、期望交期" required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">提交询盘</button>
      <p style="font-size:12px;color:var(--muted);margin-top:12px;text-align:center">💡 提示：您也可以直接通过 WhatsApp / 微信联系我们，响应更快</p>
    </form>
  </div>

  <div class="footer">
    <p>© 2026 莱恩制造 Laien Manufacturing | <a href="index.html">返回首页</a></p>
  </div>
</div>

<script>
// 自动设置回复邮箱
document.getElementById('emailField').addEventListener('input', function(){
  document.getElementById('replytoField').value = this.value;
});

// 检测提交成功
if(window.location.search.includes('sent=1')){
  document.getElementById('successAlert').classList.add('show');
  window.history.replaceState({}, document.title, window.location.pathname);
}

// Loading 状态
document.getElementById('contactForm').addEventListener('submit', function(){
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = '发送中...';
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS 2026 产品目录 | 雷恩富庄 B2B</title>
    <style>
        :root { --primary: #1a3c2b; --primary-light: #2d5a45; --bg: #f5f5f0; --card-bg: #fff; --text: #333; --text-light: #666; --border: #e8e8e3; --shadow: 0 4px 24px rgba(0,0,0,0.06); --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .header { background: var(--primary); color: #fff; text-align: center; padding: 60px 20px 50px; position: relative; overflow: hidden; }
        .header::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.3; }
        .header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 12px; letter-spacing: 1px; position: relative; }
        .header p { font-size: 1.05rem; opacity: 0.85; font-weight: 300; position: relative; }
        .badge { display: inline-block; background: rgba(255,255,255,0.15); padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; margin-top: 16px; position: relative; }
        .nav-bar { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 12px 20px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-bar a { color: rgba(255,255,255,0.8); text-decoration: none; padding: 6px 16px; border-radius: 20px; font-size: 0.9rem; transition: all 0.2s; }
        .nav-bar a:hover, .nav-bar a.active { background: rgba(255,255,255,0.2); color: #fff; }
        .stats-bar { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin: 24px auto; max-width: 1160px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .stat-item h4 { font-size: 1.8rem; color: var(--primary); margin-bottom: 4px; }
        .stat-item p { font-size: 0.85rem; color: var(--text-light); }
        .filter-bar { max-width: 1200px; margin: 0 auto; padding: 0 20px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .filter-label { font-size: 0.9rem; color: var(--text-light); margin-right: 8px; }
        .filter-btn { padding: 8px 18px; border: 1px solid var(--border); background: var(--card-bg); border-radius: 20px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; color: var(--text); }
        .filter-btn:hover, .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .container { max-width: 1200px; margin: 0 auto; padding: 8px 20px 40px; }
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .product-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--border); transition: all 0.3s ease; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
        .product-image { position: relative; width: 100%; padding-bottom: 133%; background: linear-gradient(135deg, #e8e8e3 0%, #d0d0c8 100%); overflow: hidden; }
        .product-image img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
        .product-card:hover .product-image img { transform: scale(1.05); }
        .product-image.no-image::after { content: attr(data-id); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #999; font-size: 0.9rem; font-weight: 500; }
        .product-tag { position: absolute; top: 12px; left: 12px; background: var(--primary); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; z-index: 2; }
        .product-info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .product-id { font-size: 0.8rem; color: var(--text-light); font-family: "SF Mono", Monaco, monospace; margin-bottom: 4px; }
        .product-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; color: var(--text); line-height: 1.4; }
        .product-meta { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; flex: 1; }
        .meta-item { font-size: 0.85rem; color: var(--text-light); }
        .product-actions { display: flex; gap: 8px; }
        .btn-size, .btn-inquiry { flex: 1; padding: 10px 0; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: 500; cursor: pointer; text-align: center; text-decoration: none; transition: all 0.2s; }
        .btn-size { background: #f0f0eb; color: var(--text); }
        .btn-size:hover { background: #e0e0d8; }
        .btn-size.disabled { opacity: 0.6; cursor: default; }
        .btn-inquiry { background: var(--primary); color: #fff; }
        .btn-inquiry:hover { background: var(--primary-light); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card-bg); border-radius: var(--radius); max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { padding: 24px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; }
        .modal-title { font-size: 1.2rem; font-weight: 600; }
        .modal-subtitle { font-size: 0.85rem; color: var(--text-light); margin-top: 4px; font-family: monospace; }
        .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-light); padding: 4px; line-height: 1; }
        .modal-close:hover { color: var(--text); }
        .modal-body { padding: 20px 24px 24px; }
        .size-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .size-table th { background: var(--primary); color: #fff; padding: 12px 10px; text-align: center; font-weight: 500; }
        .size-table th:first-child { border-radius: 8px 0 0 0; }
        .size-table th:last-child { border-radius: 0 8px 0 0; }
        .size-table td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border); }
        .size-table tr:nth-child(even) { background: #fafaf8; }
        .size-table tr:hover { background: #f0f0eb; }
        .modal-note { margin-top: 16px; padding: 12px; background: #fafaf8; border-radius: 8px; font-size: 0.85rem; color: var(--text-light); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-align: center; text-decoration: none; }
        .modal-btn-primary { background: var(--primary); color: #fff; }
        .modal-btn-secondary { background: #f0f0eb; color: var(--text); }
        .contact-section { background: var(--primary); color: #fff; padding: 60px 20px; margin-top: 40px; }
        .contact-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        .contact-left h2 { font-size: 2rem; margin-bottom: 16px; }
        .contact-left p { opacity: 0.85; line-height: 1.8; margin-bottom: 24px; }
        .contact-info-list { display: flex; flex-direction: column; gap: 12px; }
        .contact-info-item { display: flex; align-items: center; gap: 12px; font-size: 0.95rem; }
        .contact-info-item a { color: #fff; text-decoration: none; opacity: 0.9; }
        .contact-info-item a:hover { opacity: 1; text-decoration: underline; }
        .contact-right { background: rgba(255,255,255,0.1); border-radius: var(--radius); padding: 32px; backdrop-filter: blur(10px); }
        .contact-right h3 { margin-bottom: 20px; font-size: 1.2rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; opacity: 0.9; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 0.95rem; font-family: inherit; }
        .form-group input::placeholder, .form-group textarea::placeholder { color: rgba(255,255,255,0.5); }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: rgba(255,255,255,0.5); }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .btn-submit { width: 100%; padding: 14px; background: #fff; color: var(--primary); border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-submit:hover { background: #f0f0eb; transform: translateY(-1px); }
        .pdf-bar { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin: 0 auto 24px; max-width: 1160px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .pdf-bar-text h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .pdf-bar-text p { font-size: 0.9rem; color: var(--text-light); }
        .btn-pdf { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: var(--primary); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 500; transition: all 0.2s; }
        .btn-pdf:hover { background: var(--primary-light); }
        .footer { text-align: center; padding: 24px; font-size: 0.85rem; color: var(--text-light); background: var(--bg); }
        @media (max-width: 1024px) { .product-grid { grid-template-columns: repeat(2, 1fr); } .contact-inner { grid-template-columns: 1fr; gap: 40px; } }
        @media (max-width: 640px) { .header { padding: 40px 20px; } .header h1 { font-size: 1.8rem; } .product-grid { grid-template-columns: 1fr; } .stats-bar { grid-template-columns: repeat(2, 1fr); } .pdf-bar { flex-direction: column; text-align: center; } .modal { max-height: 85vh; } .contact-right { padding: 24px; } }
    </style>
</head>
<body>
    <header class="header">
        <h1>SS 2026 产品目录</h1>
        <p>18 款春夏新品 · 支持 OEM & ODM 定制 · 广州女装制造商</p>
        <div class="badge">Women's Apparel | OEM & ODM Services</div>
        <nav class="nav-bar">
            <a href="#products" class="active">全部产品</a>

            <a href="#contact">联系我们</a>

    </div>
    <div class="filter-bar">
        <span class="filter-label">筛选:</span>
        <button class="filter-btn active" onclick="filterProducts('all', this)">全部</button>
        <button class="filter-btn" onclick="filterProducts('套装', this)">套装</button>

        <button class="filter-btn" onclick="filterProducts('休闲裤', this)">裤装</button>
        <button class="filter-btn" onclick="filterProducts('上衣', this)">上衣</button>
        <button class="filter-btn" onclick="filterProducts('两件套', this)">两件套</button>
    </div>
    <main class="container" id="products">
        <div class="product-grid">

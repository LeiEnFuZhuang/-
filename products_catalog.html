<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线浏览 SS 2026 画册 | 莱恩制造</title>
<style>
:root{--primary:#1a3c2b;--accent:#c9a96e;--bg:#f5f5f0;--text:#333;--muted:#666;--border:#e8e8e3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100}
.header-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo-icon{width:36px;height:36px;background:var(--primary);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.logo-text{font-size:18px;font-weight:700;color:var(--primary);letter-spacing:1px}
.nav{display:flex;gap:28px;align-items:center}
.nav a{color:var(--text);text-decoration:none;font-size:14px;font-weight:500;transition:color .2s}
.nav a:hover{color:var(--primary)}
.nav a.active{color:var(--primary);border-bottom:2px solid var(--accent);padding-bottom:2px}
.hero{text-align:center;padding:48px 20px 32px;background:linear-gradient(180deg,#fff 0%,var(--bg) 100%)}
.hero-label{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px}
.hero h1{font-size:36px;font-weight:800;color:var(--primary);margin-bottom:12px}
.hero p{color:var(--muted);font-size:16px;max-width:500px;margin:0 auto}
.pdf-section{max-width:1100px;margin:0 auto;padding:0 20px 40px}
.pdf-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.pdf-title{font-size:16px;font-weight:600;color:var(--primary)}
.pdf-actions{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;transition:all .2s;cursor:pointer;border:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#2d5a45}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--border)}
.btn-outline:hover{background:#f5f5f0}
.pdf-wrapper{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.08);overflow:hidden;border:1px solid var(--border)}
.pdf-frame{width:100%;height:80vh;min-height:600px;border:none;display:block}
.pdf-fallback{display:none;text-align:center;padding:60px 20px}
.pdf-fallback h3{font-size:20px;color:var(--primary);margin-bottom:12px}
.pdf-fallback p{color:var(--muted);margin-bottom:24px;font-size:14px}
.footer{text-align:center;padding:32px 20px;font-size:13px;color:var(--muted);border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){
.nav{display:none}
.hero h1{font-size:28px}
.pdf-frame{height:70vh;min-height:500px}
.pdf-toolbar{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<header class="header">
<div class="header-inner">
<a href="index.html" class="logo">
<div class="logo-icon">莱</div>
<div class="logo-text">莱恩制造</div>
</a>
<nav class="nav">
<a href="index.html">首页</a>
<a href="index.html#products">产品中心</a>
<a href="products_catalog.html" class="active">电子画册</a>
<a href="index.html#about">关于我们</a>
<a href="index.html#contact">联系我们</a>
</nav>
</div>
</header>
<section class="hero">
<div class="hero-label">DIGITAL CATALOG</div>
<h1>在线浏览 SS 2026 画册</h1>
<p>18 款春夏新品，支持翻页浏览，点击右下角下载完整 PDF</p>
</section>
<section class="pdf-section">
<div class="pdf-toolbar">
<div class="pdf-title">STYLE COLLECTION Spring / Summer 2026</div>
<div class="pdf-actions">
<a href="Fashion_Catalog_B2B.pdf" download class="btn btn-primary">下载 PDF 画册</a>
<a href="index.html" class="btn btn-outline">返回首页</a>
</div>
</div>
<div class="pdf-wrapper">
<iframe 
class="pdf-frame" 
src="Fashion_Catalog_B2B.pdf#toolbar=1&navpanes=0" 
title="SS 2026 电子画册"
loading="lazy">
</iframe>
<div class="pdf-fallback" id="pdfFallback">
<h3>无法加载 PDF 预览</h3>
<p>您的浏览器不支持在线预览，请下载 PDF 文件查看</p>
<a href="Fashion_Catalog_B2B.pdf" download class="btn btn-primary">下载 PDF 画册</a>
</div>
</div>
</section>
<footer class="footer">
<p>© 2026 莱恩制造 Laien Manufacturing · SS 2026 Style Collection · OEM & ODM Services</p>
</footer>
<script>
document.querySelector('.pdf-frame').addEventListener('error',function(){
document.getElementById('pdfFallback').style.display='block';
this.style.display='none';
});
</script>
</body>
</html>
